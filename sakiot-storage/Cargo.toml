[package]
name = "sakiot-storage"
version.workspace = true
edition = "2024"

[dependencies]
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "rt-tokio",
] }
# The SDK's `default-https-client` pins rustls to aws-lc; build the same
# client on ring so the whole workspace shares one crypto provider.
aws-smithy-http-client = { version = "1", features = ["rustls-ring"] }
hex = "0.4"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = "0.8"
futures-util = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }

[lints]
workspace = true
