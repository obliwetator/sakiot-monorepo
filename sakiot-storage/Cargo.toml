[package]
name = "sakiot-storage"
version.workspace = true
edition = "2024"

[dependencies]
aws-config = "1"
aws-credential-types = "1"
aws-sdk-s3 = "1"
aws-types = "1"
hex = "0.4"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = "0.8"
futures-util = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }

[lints]
workspace = true
