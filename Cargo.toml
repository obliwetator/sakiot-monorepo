[workspace]
members = [
    "fbi-agent",
    "ops/sakiot-dev",
    "ops/sakiot-deploy",
    "sakiot-paths",
    "sakiot-proto",
    "sakiot-storage",
    "web-server",
]
exclude = ["sakiot-DSP"]
resolver = "3"

# Single source of truth for the product version. Bumping this in a PR and
# merging to main is what cuts a release: CI tags v<version> after the staging
# deploy verifies, and the tag push triggers the production deploy.
[workspace.package]
version = "1.0.30"

# CI runs tests through cargo-nextest; keeping only line tables (instead of
# full debug info) noticeably cuts test compile time and binary size.
[profile.test]
debug = "line-tables-only"

# Restriction lints for production code, inherited by every crate via
# `lints.workspace = true`. Tests are exempted in clippy.toml
# (allow-unwrap-in-tests etc.); intentional prints in the deploy CLI carry
# scoped `#[expect]`s. CI enforces with
# `cargo clippy --workspace --all-targets -- -D warnings`.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
