[package]
name = "web-server"
version.workspace = true
license.workspace = true
publish.workspace = true
edition = "2024"

# The binary keeps its underscore name: release layouts, systemd units, and
# the deploy engine all install and run `web_server`.
[[bin]]
name = "web_server"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "signal", "sync", "time"] }
# No HTTP/2 or response compression: nginx terminates both and talks HTTP/1.1
# to the server, and leaving them out drops h2 and the compression codecs.
actix-web = { version = "4", default-features = false, features = [
	"cookies",
	"macros",
	"unicode",
	"ws",
] }
actix-rt = "2.9.0"
actix-cors = "0.7"
actix-ws = "0.4"
actix-files = "0.6"
reqwest = { version = "0.12", default-features = false, features = [
	"charset",
	"http2",
	"json",
	"rustls-tls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-log = "0.2"
sqlx = { version = "0.9", features = [
	"runtime-tokio",
	"tls-rustls",
	"postgres",
	"chrono",
	"json",
] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
time = "0.3.36"
tonic = "0.14"
thiserror = "2"
tokio-util = "0.7.8"
parking_lot = "0.12.1"
base64 = { version = "0.22.1", features = ["alloc"] }
bytes = "1.11.1"
dotenvy = "0.15.7"
uuid = { version = "1.23.0", features = ["v4", "fast-rng"] }
sakiot-paths = { path = "../sakiot-paths" }
sakiot-peaks = { path = "../sakiot-peaks" }
sakiot-permissions = { path = "../sakiot-permissions" }
sakiot-process = { path = "../sakiot-process" }
sakiot-proto = { path = "../sakiot-proto" }
sakiot-storage = { path = "../sakiot-storage" }
sakiot-dsp = { path = "../sakiot-dsp" }
opentelemetry = "0.32.0"
opentelemetry_sdk = { version = "0.32.1", features = ["metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32.0", features = [
	"grpc-tonic",
	"metrics",
] }
tracing-opentelemetry = "0.33.0"
utoipa = { version = "5", features = ["actix_extras", "chrono"] }
utoipa-scalar = { version = "0.3", features = ["actix-web"] }
libc = "0.2.186"
subtle = "2"
urlencoding = "2"
fastrand = "2"

[dev-dependencies]
actix-codec = "0.5"
actix-http = "3"
actix-test = "0.1"
awc = "3"
ogg = "0.9"
# Only the `std` feature: the permission harness drives proptest's value
# trees from async tests, so its forking runner is unused.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
sakiot-permissions = { path = "../sakiot-permissions", features = ["testing"] }
tempfile = "3"

[features]
default = []
# Non-production builds (local `cargo dev`, staging, preview) are built with
# `dev-login`, so it also brings in the load-test harness (`src/loadtest/`).
# Production builds enable neither.
dev-login = ["loadtest"]
loadtest = []

[lints]
workspace = true
