# Restriction lints (unwrap_used / expect_used / panic) are denied for
# production code by the root Cargo.toml's [workspace.lints.clippy], which every
# crate inherits. Tests legitimately unwrap/expect/panic to fail loudly, and CI
# lints --all-targets, so allow them there.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
