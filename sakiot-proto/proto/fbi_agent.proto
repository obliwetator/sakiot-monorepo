syntax = "proto3";

// gRPC API exposed by the FBI Agent Discord bot. Consumed by web_server.
package fbi_agent;

service Jammer {
	rpc JamIt (JamData) returns (JamResponse);
}

service Admin {
	rpc StartDrain (DrainRequest) returns (DrainStatus);
	rpc CancelDrain (DrainRequest) returns (DrainStatus);
	rpc GetDrainStatus (Empty) returns (DrainStatus);
	rpc ShutdownWhenEmpty (DrainRequest) returns (DrainStatus);
	rpc ForceShutdown (DrainRequest) returns (DrainStatus);
}

message Empty {}

message DrainRequest {
	string reason = 1;
}

enum BotRole {
	BOT_ROLE_UNSPECIFIED = 0;
	BOT_ROLE_ACTIVE = 1;
	BOT_ROLE_DRAIN = 2;
}

enum VoicePresence {
	VOICE_PRESENCE_UNSPECIFIED = 0;
	VOICE_PRESENCE_EMPTY = 1;
	VOICE_PRESENCE_CONNECTED = 2;
}

message DrainStatus {
	string instance_id = 1;
	string role = 2 [deprecated = true];
	bool draining = 3;
	bool shutdown_when_empty = 4;
	uint64 drain_timeout_seconds = 5;
	uint32 active_voice_connections = 6;
	string message = 7;
	uint64 drain_age_seconds = 8;
	bool force_shutdown = 9;
	string voice_state = 10 [deprecated = true];
	uint64 active_recordings = 11;
	BotRole bot_role = 12;
	VoicePresence voice_presence = 13;
}

message JamData {
	string clip_name = 1;
	int64 guild_id = 2;
	int64 user_id = 3;
}

message JamResponse {
	enum JamResponseEnum {
		OK = 0;
		NOT_PRESENT = 1;
		UNKNOWN = 2;
		COOLDOWN = 3;
	}

	JamResponseEnum resp = 1;
	uint32 cooldown_remaining_seconds = 2;
}
