[package]
name = "sakiot-dev"
version.workspace = true
edition = "2024"

description = "Local development orchestration for Sakiot"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
dotenvy = "0.15"
futures-util = "0.3"
getrandom = "0.3"
libc = "0.2"
sakiot-paths = { path = "../../sakiot-paths" }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres"] }
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal", "time", "io-util"] }
url = "2"
uuid = { version = "1", features = ["v4", "fast-rng"] }

[lints]
workspace = true
