name: CI

on:
  pull_request:
    # Docs-only PRs skip the test suite. Same conservative list as the
    # deploy-staging push trigger; workflow_call below is unaffected so
    # deploy workflows always run the full suite.
    paths-ignore:
      - "**.md"
      - "LICENSE*"
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: sakiot_rouvas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 54320:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sakiot_rouvas"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      # Compile-time query validation comes from the checked-in .sqlx
      # metadata; the live database is only for #[sqlx::test] fixtures.
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://postgres:password@localhost:54320/sakiot_rouvas
    steps:
      - uses: actions/checkout@v4

      # Installs the toolchain pinned in rust-toolchain.toml (including its
      # components) and provides rust-cache keyed against that toolchain.
      # rustflags must stay empty: the action's default -D warnings would
      # change build behavior; the clippy step opts in explicitly instead.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      # sakiot-proto's build script needs protoc; the runner image does not
      # ship it, and only a warm build cache hides that.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler

      # scripts/sqlx-cli-version is the single source of truth for the pin;
      # scripts/sqlx-prepare.sh reads the same file.
      - name: Read pinned sqlx-cli version
        run: echo "SQLX_CLI_VERSION=$(tr -d '[:space:]' <scripts/sqlx-cli-version)" >> "$GITHUB_ENV"

      # rust-cache does not cover ~/.cargo/bin, so cache the two installed
      # binaries directly (cargo sqlx dispatches to cargo-sqlx).
      - name: Cache SQLx CLI
        id: cache-sqlx
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/sqlx
            ~/.cargo/bin/cargo-sqlx
          key: sqlx-cli-${{ env.SQLX_CLI_VERSION }}-postgres-native-tls-${{ runner.os }}

      - name: Install SQLx CLI
        if: steps.cache-sqlx.outputs.cache-hit != 'true'
        run: cargo install sqlx-cli --version "$SQLX_CLI_VERSION" --locked --no-default-features --features postgres,native-tls

      - name: Apply database migrations
        run: SQLX_OFFLINE=false cargo sqlx migrate run --source sakiot-db/migrations

      - name: Check SQLx metadata
        run: SQLX_OFFLINE=false cargo sqlx prepare --check --workspace -- --all-targets

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # The SSH forced command and systemctl sudo wrapper are installed
  # out-of-band on the VPS, so deploys never rebuild them; without this job
  # their bash suites only run there (ops/update-deploy-engine.sh) and a PR
  # could regress the shims unnoticed. The suites are hermetic (mktemp
  # sandboxes, stub binaries, no root/systemd) and finish in seconds, so run
  # them unconditionally rather than path-filtering.
  ops-shims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ops shim test suites
        run: ops/tests/run.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sakiot-stage
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      # Runs biome check and tsc before vite build. This is a smoke build
      # (the artifact is never shipped); real deploys bake VITE_API_URL from
      # the target's env file, and vite.config.ts refuses to build without it.
      - name: Build
        run: bun run build
        env:
          VITE_API_URL: https://ci.sakiot.test/api/
