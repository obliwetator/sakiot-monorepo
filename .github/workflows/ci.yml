name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE*"
  workflow_call:
    inputs:
      full:
        description: Run every suite for a trusted deployment gate
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      dsp: ${{ steps.scope.outputs.dsp }}
      api_contract: ${{ steps.scope.outputs.api_contract }}
      frontend: ${{ steps.scope.outputs.frontend }}
      ops: ${{ steps.scope.outputs.ops }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Test suite selection rules
        run: bash scripts/ci-scope.test.sh

      - name: Select affected suites
        id: scope
        env:
          FULL: ${{ inputs.full || false }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          select_all() {
            printf '%s\n' \
              'rust=true' \
              'dsp=true' \
              'api_contract=true' \
              'frontend=true' \
              'ops=true' >>"${GITHUB_OUTPUT}"
          }

          if [[ "${FULL}" == "true" ]]; then
            select_all
            exit 0
          fi

          if [[ ! "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]] \
            || [[ ! "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]] \
            || [[ "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]] \
            || ! git cat-file -e "${BASE_SHA}^{commit}" \
            || ! git cat-file -e "${HEAD_SHA}^{commit}"; then
            echo "::notice::Cannot resolve change range; selecting every CI suite"
            select_all
            exit 0
          fi

          git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" \
            | scripts/ci-scope.sh >>"${GITHUB_OUTPUT}"

  rust-clippy:
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rustflags: ""
          cache-targets: false
          cache-save-if: ${{ github.event_name != 'pull_request' }}

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Install protoc and fast linker
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler lld

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: sakiot_rouvas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 54320:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sakiot_rouvas"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://postgres:password@localhost:54320/sakiot_rouvas
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rustflags: ""
          cache-targets: false
          cache-save-if: ${{ github.event_name != 'pull_request' }}

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Install protoc and fast linker
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler lld

      - name: Read pinned sqlx-cli version
        run: echo "SQLX_CLI_VERSION=$(tr -d '[:space:]' <scripts/sqlx-cli-version)" >>"${GITHUB_ENV}"

      - name: Cache SQLx CLI
        id: cache-sqlx
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/sqlx
            ~/.cargo/bin/cargo-sqlx
          key: sqlx-cli-${{ env.SQLX_CLI_VERSION }}-postgres-native-tls-${{ runner.os }}

      - name: Install SQLx CLI
        if: steps.cache-sqlx.outputs.cache-hit != 'true'
        run: cargo install sqlx-cli --version "${SQLX_CLI_VERSION}" --locked --no-default-features --features postgres,native-tls

      - name: Apply database migrations
        run: SQLX_OFFLINE=false cargo sqlx migrate run --source sakiot-db/migrations

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check SQLx metadata
        run: SQLX_OFFLINE=false cargo sqlx prepare --check --workspace -- --all-targets

      - name: Read pinned cargo-nextest version
        run: |
          echo "NEXTEST_VERSION=$(tr -d '[:space:]' <scripts/nextest-version)" >>"${GITHUB_ENV}"
          echo "NEXTEST_LINUX_SHA256=$(tr -d '[:space:]' <scripts/nextest-linux-sha256)" >>"${GITHUB_ENV}"

      - name: Install cargo-nextest
        run: |
          set -euo pipefail
          # Pinned version, verified against the committed checksum: `latest`
          # would let a compromised or broken release run arbitrary code here.
          archive="$(mktemp)"
          curl -LsSf "https://get.nexte.st/${NEXTEST_VERSION}/linux" -o "${archive}"
          echo "${NEXTEST_LINUX_SHA256}  ${archive}" | sha256sum -c -
          tar zxf "${archive}" -C "${CARGO_HOME:-$HOME/.cargo}/bin"
          rm -f "${archive}"

      - name: Test
        run: cargo nextest run

      - name: Doc tests
        run: cargo test --doc --workspace

  dsp:
    needs: scope
    if: needs.scope.outputs.dsp == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sakiot-DSP
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: wasm32-unknown-unknown
          cache-targets: false
          cache-save-if: ${{ github.event_name != 'pull_request' }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sakiot-DSP/package-lock.json

      - name: Read pinned wasm-bindgen CLI version
        run: echo "WASM_BINDGEN_CLI_VERSION=$(tr -d '[:space:]' <wasm-bindgen-cli-version)" >>"${GITHUB_ENV}"

      - name: Cache wasm-bindgen CLI
        id: cache-wasm-bindgen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
          key: wasm-bindgen-cli-${{ runner.os }}-${{ env.WASM_BINDGEN_CLI_VERSION }}

      - name: Install wasm-bindgen CLI
        if: steps.cache-wasm-bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_CLI_VERSION}" --locked

      - name: Install browser harness dependencies
        run: npm ci

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test native DSP
        run: cargo test --locked

      - name: Verify committed WASM/native parity
        run: node web/verify-wasm.mjs

      - name: Build WASM and worklet
        working-directory: ${{ github.workspace }}
        run: scripts/build-dsp.sh

      - name: Verify rebuilt WASM/native parity
        run: node web/verify-wasm.mjs

      # rustc can emit byte-different but behavior-identical WASM on different
      # build hosts. Both the committed and rebuilt modules are checked against
      # native DSP above; keep exact stale checks for deterministic text assets.
      - name: Check deterministic generated artifacts
        run: |
          git diff --exit-code -- \
            pkg/sakiot_dsp.js \
            pkg/sakiot_dsp.d.ts \
            pkg/sakiot_dsp_bg.wasm.d.ts \
            pkg/sakiot-dsp-worklet.bundle.js

  api-contract:
    needs: scope
    if: needs.scope.outputs.api_contract == 'true'
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rustflags: ""
          cache-targets: false
          cache-save-if: ${{ github.event_name != 'pull_request' }}

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Install protoc and fast linker
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler lld

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install frontend dependencies for API contract
        working-directory: sakiot-stage
        run: bun install --frozen-lockfile

      - name: Check generated OpenAPI types
        working-directory: sakiot-stage
        run: bun run check:api-types

  ops-shims:
    needs: scope
    if: needs.scope.outputs.ops == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run ops shim test suites
        run: ops/tests/run.sh

  frontend:
    needs: scope
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sakiot-stage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: bun run test
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: End-to-end test
        run: bun run test:e2e:ci
      - name: Build
        run: bun run build
        env:
          VITE_API_URL: https://ci.sakiot.test/api/
          # Sentinel values: a build must never inline the dev-login secret,
          # so supplying it here makes the assertion below meaningful.
          DEV_LOGIN_SECRET: ci-sentinel-dev-login-secret
          VITE_DEV_LOGIN_SECRET: ci-sentinel-dev-login-secret

      - name: Assert the dev-login secret never reaches the bundle
        env:
          DEV_LOGIN_SECRET: ci-sentinel-dev-login-secret
        run: |
          set -euo pipefail
          if grep -rIl -- "${DEV_LOGIN_SECRET}" dist; then
            echo "::error::the dev-login secret was compiled into the client bundle"
            exit 1
          fi
          echo "dist/ is free of the dev-login secret"

  result:
    if: always()
    needs:
      - scope
      - rust-clippy
      - rust-test
      - dsp
      - api-contract
      - ops-shims
      - frontend
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected suite
        env:
          SCOPE: ${{ needs.scope.result }}
          RUST_CLIPPY: ${{ needs.rust-clippy.result }}
          RUST_TEST: ${{ needs.rust-test.result }}
          DSP: ${{ needs.dsp.result }}
          API_CONTRACT: ${{ needs.api-contract.result }}
          OPS: ${{ needs.ops-shims.result }}
          FRONTEND: ${{ needs.frontend.result }}
        run: |
          set -euo pipefail
          for result in "${SCOPE}" "${RUST_CLIPPY}" "${RUST_TEST}" "${DSP}" "${API_CONTRACT}" "${OPS}" "${FRONTEND}"; do
            [[ "${result}" == "success" || "${result}" == "skipped" ]]
          done
