name: Dependency advisories

# Checks Cargo.lock against the RustSec advisory database. New advisories
# appear without any change in this repository, so this runs on a schedule
# and never gates CI or a deploy. A failure means a new advisory matches a
# dependency: update it, or add the advisory to deny.toml's ignore list with
# the reason it cannot be fixed. GitHub emails the repository owner when a
# scheduled run fails.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rustflags: ""
          cache: false

      - name: Install cargo-deny
        run: scripts/install-cargo-deny.sh

      - name: Check advisories
        run: cargo deny check advisories
