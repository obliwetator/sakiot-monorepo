name: Deploy release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      promoted:
        description: Require exact production bundle prepared by staging
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # Manual/raw tag releases retain full CI. Auto-tag dispatches only after the
  # same SHA passed CI and staging produced a digest-verified promotion.
  test:
    if: github.event_name != 'workflow_dispatch' || inputs.promoted != true
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  deploy:
    needs: test
    if: >-
      always() &&
      (needs.test.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.promoted == true))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate release input
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]

      - name: Deploy through restricted SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          PROMOTED: ${{ inputs.promoted || false }}
        run: |
          set -euo pipefail
          install -d -m 0700 "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_SSH_KEY}" >"${HOME}/.ssh/deploy_key"
          chmod 0600 "${HOME}/.ssh/deploy_key"
          trap 'rm -f "${HOME}/.ssh/deploy_key"' EXIT
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" >"${HOME}/.ssh/known_hosts"

          if [[ "${PROMOTED}" == "true" ]]; then
            command="release-promoted ${RELEASE_TAG} ${RELEASE_SHA}"
          else
            command="release-ci ${RELEASE_TAG} ${RELEASE_SHA}"
          fi
          set +e
          ssh -i "${HOME}/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "${command}"
          status=$?
          set -e
          if [[ "${status}" -eq 126 ]]; then
            echo "deploy engine predates promotions; using tested legacy path"
            ssh -i "${HOME}/.ssh/deploy_key" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "release ${RELEASE_TAG} ${RELEASE_SHA}"
          elif [[ "${status}" -ne 0 ]]; then
            exit "${status}"
          fi
